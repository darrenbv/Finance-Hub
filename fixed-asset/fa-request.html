<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CGC Finance Hub Fixed Asset Number Request"
  >

  <title>Fixed Asset Number Request | CGC Finance Hub</title>

  <!-- Existing Fixed Asset stylesheets -->
  css/fa-theme.css?v=2.2.0

  <linka-components.css?v=2.2.0

  <link
    rel="stylesheet"
    href="css/fa design styles -->
  <style>
    :root {
      --fa-primary: #173b6c;
      --fa-primary-dark: #0d294d;
      --fa-primary-light: #2d5c97;
      --fa-accent: #f3b61f;
      --fa-background: #f3f6fa;
      --fa-surface: #ffffff;
      --fa-surface-soft: #f7f9fc;
      --fa-border: #dce4ee;
      --fa-text: #172033;
      --fa-muted: #667085;
      --fa-success: #16835a;
      --fa-warning: #b26b00;
      --fa-error: #c83737;
      --fa-shadow: 0 24px 60px rgba(15, 39, 71, 0.12);
      --fa-shadow-soft: 0 10px 30px rgba(15, 39, 71, 0.08);
      --fa-radius-large: 24px;
      --fa-radius-medium: 16px;
      --fa-radius-small: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(45, 92, 151, 0.12),
          transparent 34%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(243, 182, 31, 0.1),
          transparent 32%
        ),
        var(--fa-background);
      color: var(--fa-text);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .fa-hide {
      display: none !important;
    }

    .fa-page {
      width: 100%;
      min-height: 100vh;
      padding: 28px;
    }

    .fa-app-shell {
      width: min(1180px, 100%);
      min-height: calc(100vh - 56px);
      margin: 0 auto;
      overflow: hidden;
      background: var(--fa-surface);
      border: 1px solid rgba(220, 228, 238, 0.9);
      border-radius: var(--fa-radius-large);
      box-shadow: var(--fa-shadow);
      display: grid;
      grid-template-columns: minmax(340px, 39%) minmax(0, 61%);
    }

    /* ============================================
       LEFT BRANDING PANEL
       ============================================ */

    .fa-brand-panel {
      position: relative;
      min-height: 720px;
      overflow: hidden;
      padding: 38px;
      color: #ffffff;
      background:
        linear-gradient(
          155deg,
          #173b6c 0%,
          #12345f 52%,
          #0b2545 100%
        );
      display: flex;
      flex-direction: column;
    }

    .fa-brand-panel::before {
      content: "";
      position: absolute;
      top: -110px;
      right: -100px;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(243, 182, 31, 0.28) 0%,
          rgba(243, 182, 31, 0.05) 58%,
          transparent 70%
        );
    }

    .fa-brand-panel::after {
      content: "";
      position: absolute;
      bottom: -160px;
      left: -110px;
      width: 430px;
      height: 430px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      box-shadow:
        0 0 0 45px rgba(255, 255, 255, 0.025),
        0 0 0 90px rgba(255, 255, 255, 0.018);
    }

    .fa-brand-top,
    .fa-brand-content,
    .fa-security-panel,
    .fa-brand-footer {
      position: relative;
      z-index: 1;
    }

    .fa-brand-top {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .fa-logo {
      width: 128px;
      height: 76px;
      flex-shrink: 0;
      padding: 8px;
      overflow: hidden;
      border-radius: 13px;
      background: #ffffff;
      box-shadow: 0 9px 25px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fa-logo-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .fa-brand-identity {
      min-width: 0;
    }

    .fa-brand-identity strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
    }

    .fa-brand-identity span {
      display: block;
      max-width: 190px;
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      line-height: 1.45;
    }

    .fa-brand-content {
      margin-top: auto;
      margin-bottom: auto;
      padding: 48px 0;
    }

    .fa-module-badge {
      width: fit-content;
      margin-bottom: 22px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.88);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.05px;
      text-transform: uppercase;
    }

    .fa-brand-content h1 {
      max-width: 420px;
      font-size: clamp(32px, 4vw, 47px);
      font-weight: 750;
      line-height: 1.1;
      letter-spacing: -1.4px;
    }

    .fa-brand-content h1 span {
      display: block;
      color: var(--fa-accent);
    }

    .fa-brand-description {
      max-width: 410px;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 14px;
      line-height: 1.75;
    }

    .fa-feature-list {
      display: grid;
      gap: 13px;
      margin-top: 30px;
    }

    .fa-feature {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 13px;
    }

    .fa-feature-icon {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--fa-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 750;
    }

    .fa-security-panel {
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .fa-security-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 10px;
      background: rgba(243, 182, 31, 0.14);
      color: var(--fa-accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fa-security-panel strong {
      display: block;
      font-size: 12px;
    }

    .fa-security-panel span {
      display: block;
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 11px;
      line-height: 1.5;
    }

    .fa-brand-footer {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 10.5px;
    }

    /* ============================================
       RIGHT APPLICATION PANEL
       ============================================ */

    .fa-application-panel {
      min-width: 0;
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #fbfcfe 100%
        );
      display: flex;
      flex-direction: column;
    }

    .fa-app-header {
      min-height: 88px;
      padding: 24px 38px;
      border-bottom: 1px solid var(--fa-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .fa-app-heading small {
      display: block;
      margin-bottom: 3px;
      color: var(--fa-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .fa-app-heading strong {
      color: var(--fa-primary);
      font-size: 17px;
      font-weight: 700;
    }

    .fa-signout {
      padding: 9px 14px;
      border: 1px solid var(--fa-border);
      border-radius: 999px;
      background: #ffffff;
      color: var(--fa-primary);
      font-size: 12px;
      font-weight: 650;
      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .fa-signout:hover {
      border-color: var(--fa-primary);
      background: var(--fa-surface-soft);
    }

    /* ============================================
       STEPPER
       ============================================ */

    .fa-progress-wrapper {
      padding: 26px 38px 0;
    }

    .fa-stepper {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .fa-stepper::before {
      content: "";
      position: absolute;
      top: 18px;
      left: calc(16.66% + 18px);
      right: calc(16.66% + 18px);
      height: 2px;
      background: var(--fa-border);
    }

    .fa-step {
      position: relative;
      z-index: 1;
      color: #98a2b3;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .fa-step-number {
      width: 38px;
      height: 38px;
      margin-bottom: 8px;
      border: 2px solid var(--fa-border);
      border-radius: 50%;
      background: #ffffff;
      color: #98a2b3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.25s ease;
    }

    .fa-step-label {
      font-size: 11px;
      font-weight: 650;
    }

    .fa-step.fa-step-active {
      color: var(--fa-primary);
    }

    .fa-step.fa-step-active .fa-step-number {
      border-color: var(--fa-primary);
      background: var(--fa-primary);
      color: #ffffff;
      box-shadow: 0 0 0 5px rgba(23, 59, 108, 0.11);
    }

    .fa-step.fa-step-done {
      color: var(--fa-success);
    }

    .fa-step.fa-step-done .fa-step-number {
      border-color: var(--fa-success);
      background: var(--fa-success);
      color: #ffffff;
    }

    /* ============================================
       SCREEN
       ============================================ */

    .fa-screen-container {
      width: min(640px, 100%);
      margin: 0 auto;
      padding: 46px 38px 42px;
      flex: 1;
    }

    .fa-screen {
      animation: fa-screen-enter 0.35s ease;
    }

    @keyframes fa-screen-enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fa-screen-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 22px;
      border-radius: 16px;
      background:
        linear-gradient(
          145deg,
          #edf3fa,
          #f7f9fc
        );
      color: var(--fa-primary);
      box-shadow:
        inset 0 0 0 1px rgba(23, 59, 108, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fa-screen-icon svg {
      width: 25px;
      height: 25px;
    }

    .fa-title {
      color: var(--fa-text);
      font-size: 27px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .fa-lead {
      max-width: 530px;
      margin-top: 10px;
      color: var(--fa-muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .fa-form-area {
      margin-top: 30px;
    }

    /* ============================================
       FORM CONTROLS
       ============================================ */

    .fa-field {
      margin-bottom: 20px;
    }

    .fa-field label {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      color: #344054;
      font-size: 12px;
      font-weight: 650;
    }

    .fa-required {
      color: var(--fa-error);
    }

    .fa-field input,
    .fa-field select,
    .fa-field textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--fa-border);
      border-radius: var(--fa-radius-small);
      outline: none;
      background: #ffffff;
      color: var(--fa-text);
      font-size: 14px;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .fa-field textarea {
      min-height: 108px;
      resize: vertical;
    }

    .fa-field input::placeholder,
    .fa-field textarea::placeholder {
      color: #98a2b3;
    }

    .fa-field input:focus,
    .fa-field select:focus,
    .fa-field textarea:focus {
      border-color: var(--fa-primary-light);
      box-shadow: 0 0 0 4px rgba(45, 92, 151, 0.11);
    }

    .fa-field input.fa-bad,
    .fa-field select.fa-bad,
    .fa-field textarea.fa-bad {
      border-color: var(--fa-error);
      box-shadow: 0 0 0 4px rgba(200, 55, 55, 0.09);
    }

    .fa-field-hint {
      margin-top: 7px;
      color: var(--fa-muted);
      font-size: 10.5px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .fa-field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    /* ============================================
       ACTION BUTTONS
       ============================================ */

    .fa-btn {
      min-height: 48px;
      padding: 12px 20px;
      border: 0;
      border-radius: var(--fa-radius-small);
      font-size: 13px;
      font-weight: 700;
      transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .fa-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .fa-btn-primary {
      background:
        linear-gradient(
          135deg,
          var(--fa-primary),
          var(--fa-primary-light)
        );
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(23, 59, 108, 0.2);
    }

    .fa-btn-primary:hover:not(:disabled) {
      background:
        linear-gradient(
          135deg,
          #12335e,
          #264f83
        );
      box-shadow: 0 12px 28px rgba(23, 59, 108, 0.26);
    }

    .fa-btn-secondary {
      border: 1px solid var(--fa-border);
      background: #ffffff;
      color: #344054;
    }

    .fa-btn-secondary:hover:not(:disabled) {
      border-color: #b9c6d7;
      background: var(--fa-surface-soft);
    }

    .fa-btn-block {
      width: 100%;
    }

    .fa-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      box-shadow: none;
    }

    .fa-form-actions {
      margin-top: 28px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* ============================================
       MESSAGES
       ============================================ */

    .fa-access-note {
      margin-top: 17px;
      color: var(--fa-muted);
      text-align: center;
      font-size: 10.5px;
    }

    .fa-msg {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.55;
    }

    .fa-msg-error {
      border: 1px solid #f1c5c5;
      background: #fff3f3;
      color: #9f2929;
    }

    .fa-msg-ok {
      border: 1px solid #b8dfcf;
      background: #effaf5;
      color: #126b4b;
    }

    .fa-msg-warn {
      border: 1px solid #f0d59d;
      background: #fff9ec;
      color: #885600;
    }

    /* ============================================
       OTP
       ============================================ */

    .fa-otp-email-card {
      margin-top: 24px;
      padding: 14px 16px;
      border: 1px solid var(--fa-border);
      border-radius: 12px;
      background: var(--fa-surface-soft);
      color: var(--fa-muted);
      font-size: 12px;
    }

    .fa-otp-email-card strong {
      color: var(--fa-primary);
    }

    .fa-otp-group {
      margin: 28px 0 15px;
      display: grid;
      grid-template-columns: repeat(6, minmax(42px, 58px));
      justify-content: center;
      gap: 10px;
    }

    .fa-otp-box {
      width: 100%;
      height: 62px;
      border: 1px solid var(--fa-border);
      border-radius: 12px;
      outline: none;
      background: #ffffff;
      color: var(--fa-primary);
      text-align: center;
      font-size: 25px;
      font-weight: 750;
      transition:
        transform 0.15s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .fa-otp-box:focus {
      border-color: var(--fa-primary-light);
      box-shadow: 0 0 0 4px rgba(45, 92, 151, 0.11);
      transform: translateY(-2px);
    }

    .fa-otp-box.fa-filled {
      border-color: var(--fa-primary);
      background: #f8fbff;
    }

    .fa-otp-box.fa-bad {
      border-color: var(--fa-error);
      background: #fff4f4;
      animation: fa-shake 0.3s ease;
    }

    @keyframes fa-shake {
      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .fa-otp-meta {
      margin-bottom: 22px;
      color: var(--fa-muted);
      text-align: center;
      font-size: 11px;
    }

    .fa-otp-meta strong {
      color: var(--fa-primary);
      font-variant-numeric: tabular-nums;
    }

    .fa-otp-meta.fa-expired strong {
      color: var(--fa-error);
    }

    .fa-subactions {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .fa-link {
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--fa-primary);
      font-size: 11.5px;
      font-weight: 650;
    }

    .fa-link:hover:not(:disabled) {
      text-decoration: underline;
    }

    .fa-link:disabled {
      cursor: not-allowed;
      color: #98a2b3;
    }

    /* ============================================
       USER CARD
       ============================================ */

    .fa-user-card {
      margin-bottom: 28px;
      padding: 14px;
      border: 1px solid var(--fa-border);
      border-radius: 14px;
      background: var(--fa-surface-soft);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fa-avatar {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background:
        linear-gradient(
          145deg,
          var(--fa-primary),
          var(--fa-primary-light)
        );
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 750;
    }

    .fa-user-details {
      min-width: 0;
    }

    .fa-user-details strong {
      display: block;
      overflow: hidden;
      color: #344054;
      font-size: 12.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fa-user-details small {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--fa-muted);
      font-size: 10.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fa-department {
      max-width: 180px;
      margin-left: auto;
      overflow: hidden;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eaf1f9;
      color: var(--fa-primary);
      font-size: 10px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ============================================
       TOTAL SUMMARY
       ============================================ */

    .fa-request-summary {
      margin-top: 7px;
      padding: 16px 17px;
      border: 1px solid var(--fa-border);
      border-left: 4px solid var(--fa-accent);
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #f1f5fa
        );
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .fa-request-summary span {
      color: var(--fa-muted);
      font-size: 11px;
      font-weight: 650;
    }

    .fa-request-summary strong {
      color: var(--fa-primary);
      font-size: 18px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    /* ============================================
       SUCCESS SCREEN
       ============================================ */

    .fa-success-screen {
      padding-top: 34px;
      text-align: center;
    }

    .fa-success-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border: 1px solid #b9dfd1;
      border-radius: 24px;
      background: #ecf9f4;
      color: var(--fa-success);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fa-success-enter 0.4s ease;
    }

    @keyframes fa-success-enter {
      from {
        opacity: 0;
        transform: scale(0.75);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .fa-reference-card {
      margin: 26px auto 20px;
      padding: 18px;
      border: 1px dashed var(--fa-primary-light);
      border-radius: 14px;
      background: #f6f9fd;
    }

    .fa-reference-card span {
      display: block;
      margin-bottom: 6px;
      color: var(--fa-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    .fa-reference-card strong {
      color: var(--fa-primary);
      font-family: Consolas, "Courier New", monospace;
      font-size: 22px;
      letter-spacing: 0.5px;
      word-break: break-word;
    }

    .fa-success-note {
      max-width: 480px;
      margin: 0 auto 26px;
      color: var(--fa-muted);
